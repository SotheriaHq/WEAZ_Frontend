name: Phase 8 Web Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - SIT

permissions:
  contents: read

jobs:
  web-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Legal sync CI contract
        run: npm run test:legal-sync-ci-contract

      - name: App Links (assetlinks.json) contract
        run: npm run test:app-links-contract

      - name: Production deployment readiness contract
        run: node --test scripts/test-cloudflare-deploy-wait.cjs

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Focused media and query tests
        run: npm run test:release-boot
      - name: Held subscription quote API
        run: npm run test:subscription-quotes
      - name: Verify MFA screens and request safety
        run: npm run test:mfa-security
      - name: Session response and cookie rotation isolation
        run: npm run test:session-response-isolation
      - name: Device-session modals and identity-bound actions
        run: npm run test:session-devices
      - name: Session-bound realtime recovery
        run: npm run test:session-socket

      - name: Product draft save and retry regression
        run: npx vitest run src/features/products/productPublishJob.test.ts

      - name: Performance regression guard
        run: npm run check:perf-regressions

      - name: Studio access and Settings destination state matrix
        run: npm run test:studio-access

      - name: Studio cache reuse, draft safety and private-data persistence
        run: npm run test:studio-cache
