    <!-- Brand boot gauge: a seal-shaped (curly-edged) filler ring that fills
         toward completion around the spinning thread — no text, the fill IS
         the progress. Driven by /boot/boot-splash.js (external for CSP). -->
    <div
      id="boot-splash"
      role="status"
      aria-live="polite"
      aria-label="Loading WIEZ"
      style="
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        min-height: 100dvh;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
        padding: 24px;
        background: #ffffff;
        color: #16233f;
        font-family: 'Plus Jakarta Sans', Inter, system-ui, sans-serif;
      "
    >
      <div id="boot-splash-gauge" style="position: relative; width: 92px; height: 92px;">
        <div
          id="boot-splash-ring"
          style="
            position: absolute;
            inset: 0;
            background: conic-gradient(rgba(147, 51, 234, 0.95) 28.8deg, rgba(147, 51, 234, 0.12) 0deg);
            animation: boot-drift 14s linear infinite;
          "
        ></div>
        <div
          style="
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
          "
        >
          <span
            style="font-size: 1.6rem; line-height: 1; display: inline-block; animation: boot-spin 1.8s linear infinite;"
            aria-hidden="true"
          >🧵</span>
        </div>
      </div>
    </div>

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

         alive rather than static. */
      @keyframes boot-drift {
        to {
          transform: rotate(360deg);
        }
      }
