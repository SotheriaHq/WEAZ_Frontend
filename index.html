    <!-- Brand boot gauge: a seal-shaped (curly-edged) filler ring that fills
         toward completion around the spinning thread — no text, the fill IS
         the progress. Driven by /boot/boot-splash.js (external for CSP). -->
    <div
      id="boot-splash"
      role="status"
      aria-live="polite"
      aria-label="Loading WIEZ"
      style="
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        min-height: 100dvh;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
        padding: 24px;
        background: #ffffff;
        color: #16233f;
        font-family: 'Plus Jakarta Sans', Inter, system-ui, sans-serif;
      "
    >
      <div id="boot-splash-gauge" style="position: relative; width: 76px; height: 76px; animation: boot-sway 3.6s ease-in-out infinite;">
        <div
          id="boot-splash-ring"
          style="
            position: absolute;
            inset: 0;
            background: conic-gradient(rgba(147, 51, 234, 0.95) 28.8deg, rgba(147, 51, 234, 0.12) 0deg);
            filter: drop-shadow(0 6px 16px rgba(147, 51, 234, 0.14));
            animation: boot-drift 8s linear infinite;
          "
        ></div>
        <div
          style="
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
          "
        >
          <span
            style="font-size: 1.25rem; line-height: 1; display: inline-block; animation: boot-thread 2.4s ease-in-out infinite;"
            aria-hidden="true"
          >🧵</span>
        </div>
      </div>
    </div>
    <style>
      @keyframes boot-thread {
        0% {
          transform: translate3d(-1px, 0, 0) rotate(-10deg) scale(0.96);
        }
        45% {
          transform: translate3d(1px, -2px, 0) rotate(150deg) scale(1.04);
        }
        100% {
          transform: translate3d(-1px, 0, 0) rotate(350deg) scale(0.96);
        }
      }
      @keyframes boot-sway {
        0%, 100% {
          transform: translate3d(0, 0, 0) scale(1);
        }
        50% {
          transform: translate3d(0, -2px, 0) scale(1.015);
        }
      }
      /* Slow Google-style drift of the whole gauge so the organic waves feel
         alive rather than static. */
      @keyframes boot-drift {
        to {
          transform: rotate(360deg);
        }
      }
