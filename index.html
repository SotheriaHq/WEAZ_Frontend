<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/wiez-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <title>WIEZ</title>
    <meta name="description" content="When you think WEARS, you think WIEZ. African fashion social commerce marketplace." />
    <meta name="robots" content="index,follow" />
    <meta property="og:site_name" content="WIEZ" />
    <meta property="og:title" content="WIEZ" />
    <meta property="og:description" content="When you think WEARS, you think WIEZ. African fashion social commerce marketplace." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/brand/wiez-logo-mark.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WIEZ" />
    <meta name="twitter:description" content="When you think WEARS, you think WIEZ. African fashion social commerce marketplace." />
    <meta name="twitter:image" content="/brand/wiez-logo-mark.svg" />
    <script>
      (function () {
        var storageKey = 'vite-ui-theme';
        var embeddedSurfaceKey = 'WIEZ.studio.embeddedSurface';
        var embeddedThemeKey = 'WIEZ.studio.embeddedTheme';
        var fallbackTheme = 'system';
        var root = document.documentElement;
        var storedTheme = null;
        var params = new URLSearchParams(window.location.search);
        var explicitEmbeddedSurface = params.get('surface') === 'mobile-app';
        var sessionEmbeddedSurface = false;
        var embeddedTheme = null;

        try {
          storedTheme = localStorage.getItem(storageKey);
        } catch (_error) {
          storedTheme = null;
        }

        try {
          sessionEmbeddedSurface = sessionStorage.getItem(embeddedSurfaceKey) === 'mobile-app';
        } catch (_error) {
          sessionEmbeddedSurface = false;
        }

        if (explicitEmbeddedSurface || sessionEmbeddedSurface) {
          var requestedTheme = params.get('theme');
          if (requestedTheme === 'light' || requestedTheme === 'dark') {
            embeddedTheme = requestedTheme;
            try {
              sessionStorage.setItem(embeddedSurfaceKey, 'mobile-app');
              sessionStorage.setItem(embeddedThemeKey, requestedTheme);
            } catch (_error) {}
          } else {
            try {
              var savedEmbeddedTheme = sessionStorage.getItem(embeddedThemeKey);
              embeddedTheme =
                savedEmbeddedTheme === 'light' || savedEmbeddedTheme === 'dark'
                  ? savedEmbeddedTheme
                  : null;
            } catch (_error) {
              embeddedTheme = null;
            }
          }
        }

        var theme =
          embeddedTheme ||
          (storedTheme === 'light' || storedTheme === 'dark' || storedTheme === 'system'
            ? storedTheme
            : fallbackTheme);

        var prefersDark =
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var className = theme === 'dark' || (theme === 'system' && prefersDark)
          ? 'dark'
          : 'light';

        root.classList.remove('light', 'dark');
        root.classList.add(className);
        root.dataset.theme = className;
        root.dataset.themePreference = theme;
        root.style.colorScheme = className;

        var themeColorMeta = document.querySelector('meta[name="theme-color"]');
        if (themeColorMeta) {
          themeColorMeta.setAttribute('content', className === 'dark' ? '#0a0a0a' : '#ffffff');
        }
      })();
    </script>
    <!-- Google Fonts: Playfair Display for elegant product titles -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div
      id="boot-splash"
      role="status"
      aria-live="polite"
      aria-label="Loading WIEZ"
      style="
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        min-height: 100dvh;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
        padding: 24px;
        background: #ffffff;
        color: #16233f;
        font-family: 'Plus Jakarta Sans', Inter, system-ui, sans-serif;
      "
    >
      <div
        id="boot-splash-spinner"
        style="
          width: 40px;
          height: 40px;
          border: 3px solid rgba(22, 35, 63, 0.15);
          border-top-color: #7c3aed;
          border-radius: 9999px;
          animation: boot-spin 0.8s linear infinite;
        "
      ></div>
      <div id="boot-splash-label" style="font-size: 14px; font-weight: 600; letter-spacing: 0.02em;">
        Loading WIEZ…
      </div>
    </div>
    <style>
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      html.dark #boot-splash {
        background: #0a0a0a;
        color: #f3f4f6;
      }
      html.dark #boot-splash-spinner {
        border-color: rgba(255, 255, 255, 0.12);
        border-top-color: #a78bfa;
      }
    </style>
    <div id="root"></div>
    <div id="overlay-root"></div>
    <script>
      (function () {
        var BOOT_TIMEOUT_MS = 25000;
        var timer = window.setTimeout(function () {
          var splash = document.getElementById('boot-splash');
          if (!splash || !document.body.contains(splash)) return;
          var spinner = document.getElementById('boot-splash-spinner');
          var label = document.getElementById('boot-splash-label');
          if (spinner) spinner.style.display = 'none';
          if (label) {
            label.innerHTML =
              'Still loading… <button type="button" id="boot-timeout-retry" style="display:block;margin:12px auto 0;border:0;border-radius:9999px;padding:10px 18px;background:#7c3aed;color:#fff;font-weight:600;">Tap to reload</button>';
            var retry = document.getElementById('boot-timeout-retry');
            if (retry) {
              retry.addEventListener('click', function () {
                window.location.reload();
              });
            }
          }
        }, BOOT_TIMEOUT_MS);
        window.addEventListener('wiez:boot-ready', function () {
          window.clearTimeout(timer);
        }, { once: true });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
